name: Pull Request Checks

on:
  pull_request:
    branches:
      - dev
      - master
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: eduschool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduschool_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: eduschool-app/server

    env:
      DATABASE_URL: postgresql://postgres:admin@localhost:5432/eduschool_test
      DISABLE_CRON: "true"
      DISABLE_ERD: "true"
      NODE_ENV: test
      JWT_SECRET: test-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eduschool-app/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Write boundary
        run: npm run write-boundary:check

      - name: Unit tests
        run: npm run test:unit -- --runInBand

      - name: Integration tests
        timeout-minutes: 20
        run: npm run test:integration -- --runInBand

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: eduschool-app/client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eduschool-app/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
